[phases.setup]
nixPkgs = ["php83", "nodejs_20", "composer", "nginx", "gettext"]

[phases.install]
cmds = [
    "composer install --optimize-autoloader --no-dev",
    "npm ci",
    "npm run build"
]

[phases.build]
cmds = [
    "mkdir -p database && touch database/database.sqlite",
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache",
    "php artisan migrate --force"
]

[start]
cmd = "bash -c 'envsubst \"${PORT}\" < docker/nginx.conf.template > /etc/nginx/nginx.conf && php-fpm -D && php artisan reverb:start --host=0.0.0.0 --port=8080 & nginx -g \"daemon off;\"'"